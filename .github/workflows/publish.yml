name: Build and publish Python package

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified artifacts to public PyPI
        type: boolean
        default: false

permissions: {}

concurrency:
  group: python-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    outputs:
      unpublished: ${{ steps.registry.outputs.unpublished }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Build and validate distribution files
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*
          python -m venv .wheel-test
          .wheel-test/bin/python -m pip install dist/*.whl
          .wheel-test/bin/python -I -c "from dglab_kit_python import DglabSocket, DglabSocketVersion; assert DglabSocketVersion.V4.value == 'v4'; print(DglabSocket.__name__)"
      - name: Check whether PyPI already has this version
        id: registry
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          from packaging.utils import canonicalize_name
          from packaging.version import Version

          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]
          name, version = canonicalize_name(project["name"]), Version(project["version"])
          request = Request(f"https://pypi.org/simple/{name}/", headers={"Accept": "application/vnd.pypi.simple.v1+json"})
          try:
              with urlopen(request, timeout=30) as response:
                  published = {Version(v) for v in json.load(response)["versions"]}
          except HTTPError as error:
              if error.code != 404:
                  raise
              published = set()
          unpublished = version not in published
          print(f"{name} {version}: " + ("new version" if unpublished else "already published; skipping upload"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"unpublished={str(unpublished).lower()}", file=output)
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: ${{ github.ref == 'refs/heads/main' && needs.build.outputs.unpublished == 'true' && (github.event_name == 'push' || inputs.publish) }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dglab-kit-python/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
