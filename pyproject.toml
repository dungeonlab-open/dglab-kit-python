[project]
name = "dglab-kit-python"
version = "0.1.0"
description = "Python SDK for the DG-LAB App V3 and V4 WebSocket protocols."
readme = "README.md"
license-files = ["LICENSE"]
authors = [
    { name = "LF112", email = "lf@lf112.net" }
]
requires-python = ">=3.13"
dependencies = [
    "websockets>=15.0.1",
]

[project.urls]
Homepage = "https://github.com/dungeonlab-open/dglab-kit-python"
Issues = "https://github.com/dungeonlab-open/dglab-kit-python/issues"

[build-system]
requires = ["uv_build>=0.9.1,<0.10.0"]
build-backend = "uv_build"
